name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Third-party actions are pinned to full commit SHAs.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: pnpm (via corepack, version from package.json)
        run: corepack enable && pnpm --version
      - run: pnpm install --frozen-lockfile
      - name: Build Lambdas, CLI and web
        run: |
          cd backend
          for c in api tracker; do
            GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -tags lambda.norpc -trimpath -ldflags="-s -w" -o dist/$c/bootstrap ./cmd/$c
          done
          go build -trimpath -o dist/strata ./cmd/strata
          cd .. && pnpm --filter @strata/web build
      - name: Go
        working-directory: backend
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test -race ./...
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - name: CDK synth
        working-directory: infra
        run: pnpm exec cdk synth -q
