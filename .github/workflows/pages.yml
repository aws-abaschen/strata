name: pages

# Publishes site/ to GitHub Pages as a mirror. The primary site is
# https://strata.baschen.is (S3 + CloudFront, deployed by CDK); nothing here
# touches it and no CNAME is set.

on:
  push:
    branches: [main]
    paths:
      - site/**
      - .github/workflows/pages.yml
  workflow_dispatch:

# Third-party actions are pinned to full commit SHAs.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Stage the site under the Pages base path
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          # The source uses root-absolute links (/styles.css, /) because
          # CloudFront serves it from the domain root. A project site lives
          # under a path such as /strata, so prefix those links in a copy.
          # Prefixed absolute links (not relative ones) keep 404.html working
          # at any depth. The source in site/ is not modified.
          set -euo pipefail
          rm -rf _site
          cp -r site _site
          find _site -name '*.html' -print0 \
            | xargs -0 sed -i -E "s#\b(href|src)=\"/([^/\"][^\"]*)?\"#\1=\"${BASE_PATH}/\2\"#g"
          # Fail if any root-absolute link was missed.
          if grep -rnoE "\b(href|src)=\"/[^\"]*\"" _site --include='*.html' | grep -vF "=\"${BASE_PATH}/"; then
            echo "::error::root-absolute links remain in the staged site"
            exit 1
          fi
          if grep -rnE 'url\(/' _site --include='*.css'; then
            echo "::error::root-absolute url() in CSS would break under ${BASE_PATH}"
            exit 1
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
